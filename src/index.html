<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Domain Migrator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div>
        <h1>History Domain Migrator</h1>
        <p class="subtitle">Safely copy browsing history visits from an old domain to an updated domain.</p>
      </div>
    </header>

    <section class="controls-card">
      <div class="input-row">
        <div class="field">
          <label for="oldDomain">Old Domain</label>
          <input type="text" id="oldDomain" placeholder="e.g., oldsite.com" />
        </div>

        <div class="arrow-divider">→</div>

        <div class="field">
          <label for="newDomain">New Domain</label>
          <input type="text" id="newDomain" placeholder="e.g., newsite.com" />
        </div>
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="includeSubdomains" checked />
          <span>Include subdomains (e.g., <code>sub.oldsite.com</code>)</span>
        </label>

        <label class="checkbox-label danger-option">
          <input type="checkbox" id="deleteOld" />
          <span>Delete old history entries after migrating</span>
        </label>
      </div>

      <div class="actions-row">
        <button id="previewBtn" class="btn secondary">Preview Matches</button>
        <button id="migrateBtn" class="btn primary">Migrate History</button>
      </div>

      <div id="statusBar" class="status-bar hidden"></div>
    </section>

    <section id="resultsSection" class="results-card hidden">
      <div class="results-toolbar">
        <div class="results-summary" id="resultsSummary"></div>

        <div class="filter-controls">
          <input type="text" id="filterInput" placeholder="Filter preview URLs or titles..." />
          <select id="pageSizeSelect" aria-label="Rows per page">
            <option value="25">25 / page</option>
            <option value="50" selected>50 / page</option>
            <option value="100">100 / page</option>
            <option value="250">250 / page</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-index">#</th>
              <th class="col-title">Page Title</th>
              <th class="col-url">Current (Old) URL</th>
              <th class="col-url">Updated (New) URL</th>
              <th class="col-visits">Visits</th>
            </tr>
          </thead>
          <tbody id="previewTableBody"></tbody>
        </table>
      </div>

      <div class="pagination-bar">
        <div id="pageInfo" class="page-info"></div>
        <div class="pagination-buttons">
          <button id="firstPageBtn" class="btn small secondary">« First</button>
          <button id="prevPageBtn" class="btn small secondary">‹ Previous</button>
          <button id="nextPageBtn" class="btn small secondary">Next ›</button>
          <button id="lastPageBtn" class="btn small secondary">Last »</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
